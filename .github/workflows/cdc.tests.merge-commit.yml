#
# Merge Commit Workflow. Triggers when:
#   - A pull request to develop is closed and merged
#   - A pull request to main is closed and merged
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - RAM_GITHUB_GIT_TOKEN    (Repository)

name: Merge Commit
run-name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact #${{ github.run_number }}"

on:   
  workflow_call:
    inputs:
      java-version:
        description: 'Java Version'
        required: false
        type: string
        default: '8.0.412+8'
      java-extra-args:
        description: 'Java Extra Args'
        required: false
        type: string
        default: '-Dsource.skip -DskipTests -Dcobertura.skip'
      jdk-distribution:
        description: 'JDK Distribution'
        required: false
        type: string
        default: 'temurin'
      maven-version:
        description: 'Maven Version'
        required: false
        type: string
        default: '3.9.6'
      cache-enabled:
        description: 'Cache Enabled'
        required: false
        type: boolean
        default: true
      source-folder:
        description: 'Source Folder'
        required: false
        type: string
        default: '.'
      skip-tests:
        description: 'Skip Tests'
        required: false
        type: boolean
        default: false
      next-snapshot-create-pull-request:
        description: 'Create Pull Request to develop'
        required: false
        type: boolean
        default: true
    secrets:
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true
      RAM_GITHUB_GIT_TOKEN: 
        description: 'GitHub Token for creating Pull Request to develop'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false

env:
  # Merge to main/master (base_ref)
  IS_RELEASE: ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') }}  

jobs:

  # Generate centralized tokens if needed
  # Generate centralized tokens if needed
  token-generate:
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }} 
    runs-on: ubuntu-latest
    steps:
      - name: Generate centralized tokens
        run: echo "Generando tokens centralizados con perfil 'deployer'..."

  init:
    needs: token-generate
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow schema
        run: echo "Validando el workflow 'merge-commit.yml' contra el esquema 'arqos.merge-commit.schema.yml'..."

  merge:
    needs: [ init, token-generate ]
    name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact"
    runs-on: ubuntu-latest
    steps:
      - name: Decrypt token
        run: echo "Desencriptando token centralizado de GitHub..."

      - name: Checkout code
        run: echo "Descargando el codigo del repositorio..."

      - name: Setup Java/Maven
        run: echo "Configurando las herramientas de Java y Maven (${{ inputs.java-version }} / Maven ${{ inputs.maven-version }})..."

      - name: Prepare Promotion
        run: echo "Preparando la promocion del artefacto a RELEASE en la rama ${{ github.base_ref }}..."

      - name: Build
        run: echo "Compilando e instalando el proyecto Java con Maven..."

      - name: Unit Test
        run: echo "Ejecutando las pruebas unitarias del proyecto con JUnit..."

      - name: Publish
        run: echo "Publicando los artefactos compilados en Azure Artifacts..."

      - name: Read POM
        run: echo "Leyendo y extrayendo metadatos e informacion de version del archivo pom.xml..."

      - name: Release Promotion (Commit & Push pom.xml)
        run: echo "Guardando y subiendo los cambios de version en el archivo pom.xml a la rama ${{ github.base_ref }}..."

      - name: Release Promotion (Tag Git Repository)
        run: echo "Creando y publicando la etiqueta (Tag) en el repositorio Git para esta version..."

      - name: Next Snapshot Promotion (Set next version in pom.xml)
        run: echo "Actualizando el pom.xml con la siguiente version SNAPSHOT para desarrollo..."

      - name: Next Snapshot Promotion (Commit & Push pom.xml)
        run: echo "Haciendo commit y creando el Pull Request hacia develop con la nueva version SNAPSHOT..."

  # Revoke tokens if they were generated in this workflow
