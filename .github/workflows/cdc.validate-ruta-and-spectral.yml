# Reusable workflow:
# - Ejecuta los tests de templating RTUA.
# - Valida ficheros YAML contra reglas estructurales de Spectral.

name: Validate Ruta and Spectral

on:
  workflow_call:
    inputs:
      manifest-file:
        description: 'Manifest file used by Ruta tests'
        required: false
        type: string
        default: 'project-manifest.json'

      templating-test:
        description: 'Ruta al fichero de test de templating Ruta'
        required: false
        type: string
        default: 'tests/test-templating.py'

      spectral-ruleset:
        description: 'Ruta al fichero ruleset de Spectral por defecto o fallback'
        required: false
        type: string
        default: 'spectral/rules/structure/ruleset.yml'

      spectral-files:
        description: 'Lista de ficheros YAML a validar, uno por línea'
        required: true
        type: string

      centralized-tokens:
        description: 'Indica si el workflow usa tokens centralizados'
        required: true
        type: boolean

    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'Usuario de Azure Artifacts'
        required: true

      AZURE_ARTIFACTS_PW:
        description: 'Password o token de Azure Artifacts'
        required: true

      GH_GIT_TOKEN:
        description: 'Token para checkout y acceso autenticado a GitHub'
        required: false

      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase para descifrar el token centralizado'
        required: false

jobs:

  validate-templating:
    name: Validate ruta templating
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MANIFEST_FILE: ${{ inputs.manifest-file }}
      CENTRALIZED_TOKENS: ${{ inputs.centralized-tokens }}

      AZURE_ARTIFACTS_USER: ${{ secrets.AZURE_ARTIFACTS_USER }}
      AZURE_ARTIFACTS_PW: ${{ secrets.AZURE_ARTIFACTS_PW }}

      GH_GIT_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install ".[test]" || python -m pip install .
          elif [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verify ruta test file
        shell: bash
        run: |
          set -euo pipefail

          test_file="${{ inputs.templating-test }}"

          if [[ ! -f "${test_file}" ]]; then
            echo "::error file=${test_file}::No existe el fichero de test Ruta en '${test_file}'."
            exit 1
          fi

      - name: Run ruta templating test
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest "${{ inputs.templating-test }}" \
            --verbose \
            --tb=short

  validate-spectral:
      - name: Validate YAML files with Spectral
        shell: bash
        run: |
            set -euo pipefail
  
            rules_dir="spectral/rules/structure"
            default_ruleset="${{ inputs.spectral-ruleset }}"
            raw_files="${{ inputs.spectral-files }}"
  
            if [[ -z "${raw_files// /}" ]]; then
              echo "No se han proporcionado archivos YAML para validar."
              exit 0
            fi
  
            # 1. Limpiar caracteres de retorno de carro (\r)
            clean_files=$(echo "${raw_files}" | tr -d '\r')
  
            # 2. Expandir comodines y procesar cada línea/archivo
            while IFS= read -r line; do
              # Recortar espacios en blanco al inicio y final
              line=$(echo "${line}" | xargs)
              [[ -z "${line}" ]] && continue
  
              # Expandir comodines si los hay (ej: config-CDC/**/*.yml)
              for file in ${line}; do
                if [[ ! -f "${file}" ]]; then
                  echo "::error file=${file}::No existe el fichero YAML a validar."
                  exit 1
                fi
  
                # Determina la regla a aplicar basándose en el nombre base del archivo
                base_name=$(basename "${file}" | cut -d. -f1)
                target_ruleset=""
  
                if [[ -f "${rules_dir}/${base_name}.yaml" ]]; then
                  target_ruleset="${rules_dir}/${base_name}.yaml"
                elif [[ -f "${rules_dir}/${base_name}.yml" ]]; then
                  target_ruleset="${rules_dir}/${base_name}.yml"
                elif [[ -f "${default_ruleset}" ]]; then
                  target_ruleset="${default_ruleset}"
                fi
  
                if [[ -z "${target_ruleset}" ]]; then
                  echo "::error file=${file}::No se encontró un fichero de reglas específico en '${rules_dir}/${base_name}.yaml' ni un ruleset por defecto en '${default_ruleset}'."
                  exit 1
                fi
  
                echo "Validando '${file}' con el ruleset '${target_ruleset}'..."
  
                npx --no-install spectral lint \
                  --ruleset "${target_ruleset}" \
                  --fail-severity=error \
                  "${file}"
            done
          done <<< "${clean_files}"
    
   
